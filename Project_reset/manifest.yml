modules:
  jira:issuePanel:
    - key: project-reset-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: AI Insights
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
  # Lets the app call Claude through Forge LLM (hosted by Atlassian, no API key needed).
  llm:
    - key: llm-claude
      model:
        - claude
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    # Read the issue, its comments, fields and similar issues.
    - read:jira-work
    # Save the analysis as an issue property and set story points.
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/83c6fa97-dd9c-4fe4-b2af-031be385933d
